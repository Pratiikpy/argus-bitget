state = "implemented"
baseline = """\
    polakowo/vectorbt deflated_sharpe_ratio (accessors.py:596) - not itself gated anywhere in \
    vectorbt, but silently NaN on a single trial (var_sharpe = np.var of one value, ddof=1); a \
