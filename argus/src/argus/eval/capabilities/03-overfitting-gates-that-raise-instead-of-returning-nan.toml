[[proofs]]
condition = "failure_cases_documented"
# This cited `track1_study.json`'s 0-of-12 DSR survival, which is a statement
# about the *factors* — every one rejected — and not about the gates. A gate that
# rejects a factor is working. The gates' own failures are the inputs on which
# they cannot reach a verdict at all, and those live in `overfit_gates.json`,
# where the count had been recorded since the module was written and never named.
how = """\
    2 of 8 primitives return no verdict: the deflated-Sharpe gate needs a variance across \
    trials and raises rather than returning NaN when the observations cannot supply one. The \
    refusal is designed — vectorbt's own deflated_sharpe_ratio silently NaNs on a single trial \
    — and a gate that cannot decide has still protected nothing on that input, which is why it \
    is counted as a failure case rather than folded into the rejections"""
artefact = "data/overfit_gates.json"

[[proofs]]
condition = "baseline_reproduced"
how = """\
    vectorbt's real deflated_sharpe_ratio()/approx_exp_max_sharpe() \
    (vectorbt/returns/metrics.py, the exact file this capability's baseline already names) \
    vendored verbatim - byte-verified against commit 34b6d5935e3ea3eccd549e2592bc0f455b8045f5, \
    pinned by SHA256 - and actually executed via a sys.modules shim satisfying its one \
    internal import (vectorbt._typing.Array1d) with a single-attribute stand-in rather than \
    installing plotly/numba to satisfy a type annotation. The specific defect line itself \
    (accessors.py:596, var_sharpe = np.var(x, ddof=1)) is reproduced directly as the same bare \
    numpy call, cited to its exact line, not vendored (nothing else is around it worth \
    vendoring)"""
artefact = "src/argus/eval/baselines/vectorbt_dsr_metrics.py"
test = "test_baselines.py::TestVectorbtLoaderMakesTheRealCodeRunnable"

[[proofs]]
condition = "same_input_comparison"
how = """\
    ARGUS's real deflated_sharpe and vectorbt's real deflated_sharpe_ratio run on 1,220 \
    identical inputs (5 hand-designed + a 1,215-case deterministic grid over observed x n x \
    trials x variance x skew x kurtosis) - agree EXACTLY (max abs diff across the whole sweep: \
    0.0) on every valid input, confirmed by running both real functions, not asserted from the \
    formula's own resemblance on paper"""
test = "test_dsr_comparison.py::TestSweptCases"

[[proofs]]
condition = "ablation"
how = """\
    the two NaN-input guards this comparison's own findings added to backtest/metrics.py, each \
    confirmed independently load-bearing: deflated_sharpe's variance_of_trials NaN check and \
    probabilistic_sharpe's observed/benchmark NaN check both raise on a tripped (NaN) case and \
    both pass through cleanly on an otherwise-identical cleared (finite) case, verified \
    programmatically"""
test = "test_dsr_comparison.py::TestAblation"

[[proofs]]
condition = "adversarial_test"
how = """\
    a real bug this comparison found in ARGUS's OWN code, not the baseline's: \
    deflated_sharpe's pre-existing guard was `variance_of_trials < 0`, which does not catch \
    NaN (float('nan') < 0 is False in IEEE 754) - the identical fails-every-comparison shape \
    that makes vectorbt's own gate silent. A caller computing variance the way vectorbt's \
    accessor does (np.var(x, ddof=1) on one trial) and passing it straight into ARGUS's own \
    function would have gotten a silent NaN back. probabilistic_sharpe (deflated_sharpe's own \
    single-trial reduction) had the identical gap independently. Both fixed the same session \
    this was found, verified by re-running the exact failing case after the fix"""
test = "test_metrics.py::TestDeflatedSharpe::test_nan_variance_is_refused"

[[proofs]]
condition = "reproducibility_proven"
how = """\
    both functions are pure, deterministic transforms - no model, no seed, no simulation on \
    either side. The 1,215-case sweep is itertools.product over fixed grids, not RNG-seeded, \
    same reasoning as every other sweep in this project: a seed's meaning can shift across \
    Python versions"""
test = "test_dsr_comparison.py"

[[proofs]]
condition = "no_specialist_capability_superior"
how = """\
    scoped explicitly - SCOPE_STATEMENT in eval/dsr_comparison.py. Claimed: the two \
    implementations compute the identical published formula (verified over 1,220 real-run \
    cases, not assumed from reading), and ARGUS's gate refuses exactly where vectorbt's real \
    code would go silently NaN - now genuinely true after this comparison's own finding was \
    fixed, not merely asserted by design. NOT claimed: that this was already true before the \
    fix - the pre-existing guard shared vectorbt's own blind spot until this comparison found \
    it. Also NOT claimed: that vectorbt is a worse DSR implementation in general - the formula \
    itself is identical and correct on every valid input; the only measured difference is \
    input validation at the edges, and vectorbt genuinely has none anywhere in the package for \
    this specific function (grepped directly: no >/< comparison against deflated_sharpe_ratio \
    anywhere in the repository)"""
artefact = "src/argus/eval/dsr_comparison.py"
test = "test_dsr_comparison.py::TestScopeStatement"
