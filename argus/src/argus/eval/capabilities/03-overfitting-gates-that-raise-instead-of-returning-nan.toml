blockers = [
    """\
        RE-GRADED 2026-09-25 from OWNED to IMPLEMENTED by the groupwise gate \
        (data/groupwise_audit.json): the gates' verdicts over all trials are broken down across \
        twelve symbols in data/track1_study.json (none survives, and no symbol carries that), but \
        the out-of-sample proof also reads data/overfit_gates.json, whose eight primitives were \
        run on one instrument, NVDAUSDT: a single-symbol result. Route back: run the eight \
        primitives through the gates on every symbol and record the verdict per (symbol, \
        primitive).""",
    """\
        TIED and not better on the MATH: the formulas agree with the references exactly (max abs \
        diff 0.0 over a 1,215-case sweep) - this is not a claim that ARGUS computes a better \
        Sharpe estimate. The genuinely measured advantage is narrower and now actually verified \
        rather than asserted by design: refusing silently, specifically on the NaN-propagation \
        edge case vectorbt's own real code was run against and shown to hit - and that refusal \
        itself needed a real fix mid-comparison (deflated_sharpe's own guard did not originally \
        catch NaN either), so 'ours refuses by design' was true in intent and false in the actual \
        code until this same session.""",
    """\
        General-purpose rivals run 2026-09-26 on the same 1,332 inputs \
        (data/general_overfitgates_comparison.json): pydantic v2 validate_call with FiniteFloat \
        around vectorbt's real DSR, numpy/scipy IEEE trapping, \
        scipy.stats.false_discovery_control, statsmodels multipletests, and a derandomized \
        Hypothesis search. Hypothesis found 23 failure classes in the gates as they were (every \
        gate had a silent one) and finds 0 now. On the 1,332 DSR inputs ARGUS now returns 0 \
        silent-wrong outputs, against 5 for pydantic-wrapped vectorbt, 57 for the numpy/scipy trap \
        and 95 for bare vectorbt; before the 14 guards adapted from pydantic's contract and \
        scipy's range check, ARGUS returned 28 and lost to the pydantic contract. Each guard trips \
        on the pre-adaptation code and is load-bearing. Not better than the general tools at \
        keeping an overflowing input's real answer: ARGUS refuses 3 of 6 overflow cases that have \
        one, and wrapped around the whole pipeline the numpy/scipy trap ties ARGUS on the 24 \
        real-producer cases.""",
]

