name = "Attack corpus stopped before the model, vs. HeyArka's own shield on its own corpus"
subtheme = "t2-riskcontrol"
modules = [
    "argus/eval/attack_suite.py",
    "argus/agents/quarantine.py",
    "argus/truth/novelty.py",
    "argus/truth/price_claims.py",
    "argus/agents/selection.py",
    "argus/market/evidence.py",
]
# Added 2026-10-04 (build list item 2.3). HeyArka's sixteen vectors were run through ARGUS's
# evidence stages first; the quarantine missed all three tool hijacks and both homoglyph vectors,
# and a fluent false price reached the model untouched. Two quarantine patterns
# (execution_directive, confusable_characters) and the price check were built from that, held to
# zero false withholds on 1,050 ledger theses and 5,000 README lines, and the comparison was then
# run against HeyArka's own shield on identical inputs.
state = "tied"
baseline = """\
    HeyArka @8dbb967 (MIT): its @heyarka/core CORPUS of 16 vectors in six families and its \
    @heyarka/shield pipeline (sanitize, provenance gate, corroboration gate, point-in-time guard), \
    built from source and run on its own demo context"""
blockers = [
    """\
        TIED, not won, on the comparison's own statistics: on HeyArka's demo context ARGUS stops \
        15 of 16 vectors before the model and HeyArka's shield 10 of 16 before its agent; the five \
        discordant vectors all go ARGUS's way (the three tool hijacks, the plausible falsehood, the \
        explicit no-information notice), which is p = 0.0625 on an exact two-sided sign test — \
        sixteen vectors cannot separate the gap at 0.05. A larger independent corpus is the route \
        to a result.""",
    """\
        The metric is the stage before the decision: whether attack content reaches the reader, \
        removed, collapsed or flagged. HeyArka's published 12.5% shielded susceptibility is a \
        decision metric on its naive demo agent (two of the six vectors that reach it change its \
        order); ARGUS's decision is a language model's, and running it on every vector on every \
        release is not done, so no decision-level number is claimed here.""",
    """\
        Open: sentiment-filter-manufactured-balance (two plain contrarian headlines from distinct \
        sources) reaches both readers. Nothing in either pipeline separates it from real reporting \
        at this stage. The price check flags rather than removes; its live precision was measured \
        on 167 real headlines (0 notes) none of which stated a price in the checked form, so it is \
        vacuous rather than proven on live text.""",
]

[[proofs]]
condition = "best_implementation_studied"
how = """\
    HeyArka read at source: packages/core/src/vectors/*.ts, runner.ts:18-73, score.ts:153-225, \
    packages/shield/src/shield.ts:45-122 (research/repos-t2/jhaycrypt001~heyarka); every vector's \
    transform and payload recorded with its source file:line"""
artefact = "data/heyarka_corpus.json"

[[proofs]]
condition = "baseline_reproduced"
how = """\
    HeyArka's shield run from its own built TypeScript by eval/baselines/heyarka_shield_probe.mjs \
    on its own corpus and demo context"""
artefact = "data/heyarka_shield_probe.json"

[[proofs]]
condition = "same_input_comparison"
how = """\
    ARGUS's stages and HeyArka's shield on the same 16 vectors over HeyArka's own demo context, \
    paired per vector, exact sign test"""
artefact = "data/attack_suite.json"

[[proofs]]
condition = "implementation_complete"
how = "the live gather runs the price check; the quarantine screens every evidence item"
test = "test_attack_suite.py::TestCorpus::test_the_suite_holds_its_measured_line"

[[proofs]]
condition = "adversarial_test"
how = "sixteen attack vectors from an independent red-team corpus, payloads byte for byte"
artefact = "data/attack_suite.json"

[[proofs]]
condition = "failure_cases_documented"
how = "the one vector that reaches the model is named, with what reaches it"
test = "test_attack_suite.py::TestCorpus::test_the_open_vector_is_said"

[[proofs]]
condition = "reproducibility_proven"
how = """\
    python -m argus.eval.attack_suite regenerates data/attack_suite.json; the corpus is committed \
    (data/heyarka_corpus.json) and the probe reruns from a clone"""
artefact = "data/attack_suite.json"
