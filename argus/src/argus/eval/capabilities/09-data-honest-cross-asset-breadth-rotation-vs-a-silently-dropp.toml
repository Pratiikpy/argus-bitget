test = "test_rotation_comparison.py::TestFailureCases"

[[proofs]]
condition = "reproducibility_proven"
how = "the real baseline-reproduced comparison run twice produces byte-identical JSON output"
test = "test_rotation_comparison.py::TestReproducibility"

[[proofs]]
condition = "no_specialist_capability_superior"
how = """\
    scoped explicitly — SCOPE_STATEMENT in eval/rotation_comparison.py. Claimed: on \
    data-availability and failure-mode handling for a breadth rotation rule computed on \
    ARGUS's own real, short-history cross-asset universe, ARGUS's implementation refuses \
    cleanly where the real reference silently loses part or all of the intended allocation. \
    NOT claimed the rotation rule itself has a validated forecasting edge or backtest Sharpe — \
    cross-asset rotation is directional by construction and no return claim is made here. NOT \
    claimed pytaa is broken as a monthly-rebalanced-ETF tool — the failure modes measured are \
    specific to feeding it assets whose real listing history is shorter than its own formula's \
