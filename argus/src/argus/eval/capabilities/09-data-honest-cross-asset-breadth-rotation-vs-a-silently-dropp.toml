name = "Data-honest cross-asset breadth rotation vs. a silently-dropping reference"
subtheme = "t1-rotation"
modules = [
    "argus/desk/rotation.py",
    "argus/lui/rotation.py",
    "argus/eval/rotation_comparison.py",
    "argus/eval/baselines/pytaa_vigilant_allocation.py",
    "argus/eval/baselines/pytaa_vigilant_allocation_loader.py",
    "argus/eval/baselines/pytaa_signal.py",
    "argus/eval/baselines/pytaa_signal_loader.py",
    "argus/eval/general_rotation_comparison.py",
    "argus/eval/baselines/argus_rotation_pre_contract.py",
]
state = "tied"
baseline = "pytaa real VAA breadth rule (vigilant_allocation) + Signal.momentum_score"
blockers = [
    """\
        RE-GRADED 2026-09-26 from OWNED to TIED: the rival it beat, pytaa, is the reference that \
        silently drops weight, and the best general-purpose tool for the same job does not. On 36 \
        byte-identical cases from a frozen real Bitget corpus \
        (data/general_rotation_comparison.json), pandera with pydantic, configured to the same \
        contract, handles 36 of 36, as ARGUS does; pandera alone and Great Expectations 33 (silent \
        on an empty safe set, a NaN step and an asset in both sets); raw pytaa 11. ARGUS is faster \
        (4.7ms a call against 484ms and 2.9s), which is not material at a monthly rebalance. The \
        ablation holds: the rotation.py that predates the 2026-09-25 contract, byte-pinned, \
        handles 20 of 36 with 14 silent accepts. Also found: pytaa bins by business month-end and \
        ARGUS by calendar month, so on real BTCUSDT the two scores agree exactly only when no \
        anchor month ends on a weekend and otherwise differ by up to 0.25; the 2026-09-15 \
        floating-point agreement holds only on weekday-ending anchors. OWNED returns only with a \
        margin over the configured general validator that matters to a trader.""",
    """\
        Every real instrument in this comparison's universe has at most ~13-14 months of real \
        Bitget listing history today, so the agreement measured here cannot yet be re-checked \
        across a genuinely disjoint historical time window on the same instrument — only across a \
        wider set of instruments at the same point in time. The rotation rule's own forecasting \
        value (does breadth momentum actually predict anything on this real universe) is \
        explicitly out of scope — this comparison measures data-availability and failure-mode \
        handling only""",
]

[[proofs]]
condition = "best_implementation_studied"
how = """\
