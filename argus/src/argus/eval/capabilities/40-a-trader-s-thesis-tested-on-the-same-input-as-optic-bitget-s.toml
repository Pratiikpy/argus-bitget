[[proofs]]
condition = "same_input_comparison"
how = """\
    the same three sentences ('Long MSTR/NVDA/TSLA perp into earnings — funding looks cheap') \
    through both desks the same morning"""
artefact = "data/h2h_optic/summary.json"

[[proofs]]
condition = "implementation_complete"
how = "the premise check found by this comparison, and tested"
test = "test_claim_check.py::test_cheap_funding_that_is_dear_for_this_contract_does_not_hold"

