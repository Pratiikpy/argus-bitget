name = "A trader's thesis tested on the same input as optic-bitget's desk"
subtheme = "t3-personalisation"
modules = [
    "argus/lui/research/dispatch.py",
]
state = "tied"
baseline = """\
    neromtoobad/optic-bitget (Season 2, MIT): evidence table, Bull/Bear debate twice, Judge \
    sampled three times, probability capped to 10-90%, run end to end"""
blockers = [
    """\
        TIED: optic abstained on two of three theses because its earnings and positioning rows \
        errored, and ARGUS answered exactly those rows (report date, targets, surprise, 13F, Form \
        4) plus a premise verdict measured against the contract's own settlements, with no model \
