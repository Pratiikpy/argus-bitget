        mandate's 72h ceiling, so the holding-period limit has never once bound on live data.""",
    """\
        The study also found that desk/personalisation.judge() had never checked excluded_symbols \
        at all, and reported the conservative mandate's two forbidden instruments as TAKEN. Fixed \
        2026-09-15. The measurement above is post-fix; any divergence figure quoted before that \
        date was computed with the exclusion inert.""",
    """\
        Same defect shape found again the same day: max_concurrent_positions ('a cap the book must \
