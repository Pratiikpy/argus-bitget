    test_personalisation.py::TestTheMandateRespectsTheBook::test_no_book_leaves_the_cap_inert"""

[[proofs]]
condition = "reproducibility_proven"
how = """\
    judge()/diverge()/audit() are pure Decimal arithmetic over the profile's own limits — no \
    model, no seed, no simulation; the module's own docstring states this is deliberate (a \
    model grading its own decisions is a failure documented elsewhere in this project). The \
    cross-system comparison shares the same property and adds another: mandate_comparison.py's \
    19,440-scenario grid is itertools.product over fixed value tuples, not RNG-seeded — a \
    seed's meaning can shift across Python versions, and every combination is generated the \
    same way whether or not it breaches anything, which a hand-picked seed value could not \
    promise. Runs in ~1 second, no network, same output every run"""
test = "test_personalisation.py"

