[[proofs]]
condition = "failure_cases_documented"
how = """\
    three real cases found by reading and then by testing, not assumed away: (1) Nautilus's \
    real TWAP floors each child order and schedules the shortfall as an extra slice \
    (twap.rs:220-309) — ARGUS's Trajectory did not, closed by \
    execution.schedule.quantise_trajectory; (2) Nautilus never schedules a slice below the \
    venue's tradeable minimum, merging it forward instead (twap.rs's own \
    '..._below_size_increment'/'..._below_min_quantity' tests) — also closed, with a \
    `min_order_qty` parameter; (3) the FIRST version of the fix for (1) had its own real bug, \
    caught by these tests rather than by inspection — flooring each slice independently before \
    carrying anything forward silently discarded each slice's own fractional remainder, so an \
    extreme schedule emitted 18 zero-quantity 'slices' that still summed correctly but were \
    not real orders. Fixed by tracking the running RAW cumulative total instead of \
    pre-truncated per-slice values"""
artefact = "src/argus/execution/schedule.py"
test = "test_schedule.py::TestQuantiseTrajectory"

[[proofs]]
condition = "reproducibility_proven"
