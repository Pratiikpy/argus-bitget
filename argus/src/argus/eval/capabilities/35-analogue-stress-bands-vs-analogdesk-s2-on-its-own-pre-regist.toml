name = "Analogue stress bands vs. AnalogDesk (S2) on its own pre-registered test"
subtheme = "t3-decisionstress"
modules = [
    "argus/desk/analogue.py",
    "argus/desk/shapematch.py",
    "argus/eval/analogstress_comparison.py",
    "argus/eval/baselines/analogdesk_export.mjs",
]
state = "tied"
baseline = """\
    lixinde586-afk/analogdesk — an S2 entry in this sub-theme — run unmodified from a local \
    clone on its own grid: 2,698 test queries, 71 US names, 2023-2026, H = 5"""
blockers = [
    """\
        TIED on the primary score: ARGUS's analogue band scores 15.52 Winkler against AnalogDesk's \
        15.25 (AnalogDesk numerically ahead, Diebold-Mariano p = 0.18), and both lose to the naive \
        same-name band (15.14). ARGUS wins two secondary measures: its raw analogue distribution \
        is far better calibrated (PIT chi-square 92 against 208.6) and the path matcher's \
        matched-coverage width is narrower (10.03% against 10.20%). A regime-scaled same-name \
        band, chosen among three variants on 2019-2022 only (the idea itself prompted by the test \
        result), scores 14.86 — ahead of AnalogDesk (15.25) and the naive band (15.14), but not \
        significantly (p = 0.16 and 0.24); it does beat the volatility harness significantly (p = \
        0.04). Path-breach Brier is not scored: ARGUS's engines do not return intraday excursions""",
    """\
        retrieval diversity, 2026-09-25 (data/retrieval_diversity.json: paper-qa's maximal \
        marginal relevance on the same 2,698-query grid, lambda chosen on 2019-2022 only): a TIE \
        for the analogue engine - MMR at lambda 0.3 scores 15.49 Winkler against 15.52 without it \
        (Diebold-Mariano p = 0.51), so diversity neither helps nor hurts the band; the engine's \
        default stays nearest-first""",
]

[[proofs]]
condition = "best_implementation_studied"
how = """\
    AnalogDesk's engine read at source (analog.mjs, distribution.mjs, validation.mjs) and \
    chosen by the rival review of 2026-09-24 as the entry to beat in Decision Stress Testing"""
artefact = "data/analogstress_comparison.json"

[[proofs]]
condition = "baseline_reproduced"
how = """\
    our scorer, written from their protocol, reproduces their own published multipliers, \
    coverage, width, matched width and PIT chi-square exactly (max difference 0.0)"""
artefact = "data/analogstress_comparison.json"

[[proofs]]
condition = "same_input_comparison"
how = """\
    ARGUS answers their exported queries from the same adjusted closes, truncated and \
    embargoed at each query session"""
artefact = "data/analogstress_comparison.json"

[[proofs]]
condition = "statistically_valid_evaluation"
how = """\
    Winkler scores compared per query with a Diebold-Mariano test on differences clustered by \
    query date; coverage standard errors clustered by date"""
artefact = "data/analogstress_comparison.json"

[[proofs]]
condition = "out_of_sample_test"
how = "multipliers frozen on 2019-2022, scored on 2023-2026, as their protocol fixes"
artefact = "data/analogstress_comparison.json"

[[proofs]]
condition = "failure_cases_documented"
how = "every predictor fails PIT; the naive band beats every retrieval method"
artefact = "data/analogstress_comparison.json"

[[proofs]]
condition = "reproducibility_proven"
how = "deterministic: their engine, their grid, a fixed ARGUS configuration"
artefact = "data/analogstress_comparison.json"

[[proofs]]
condition = "implementation_complete"
how = "both ARGUS engines ran on every query"
artefact = "data/analogstress_comparison.json"
