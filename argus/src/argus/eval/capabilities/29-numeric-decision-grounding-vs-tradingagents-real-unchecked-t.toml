name = "Numeric decision grounding vs. TradingAgents' real, unchecked TraderProposal"
subtheme = "t2-explainability"
modules = [
    "argus/truth/grounding.py",
    "argus/eval/explainability_comparison.py",
    "argus/eval/baselines/tradingagents_trader.py",
    "argus/eval/baselines/tradingagents_trader_loader.py",
]
state = "implemented"
baseline = """\
    TradingAgents' real, unmodified TraderProposal (agents/schemas.py) — the structured-output \
    type its real Trader agent fills to produce every transaction proposal, including \
    entry_price and stop_loss"""
blockers = [
    """\
        RE-GRADED 2026-09-27 from OWNED to IMPLEMENTED by the groupwise gate \
        (data/groupwise_audit.json): its statistical and out-of-sample evidence is \
        data/explainability_comparison.json, twelve fabrications the author chose - four \
        magnitudes on three live prices - so the check catches what it was built to catch by \
        construction, and the gate had filed the set as a population (audit finding 95). A general \
        validator was never run either: a pydantic band check on the two price fields would \
        plausibly catch the same twelve. Route back: run grounding.check, TraderProposal and a \
        pydantic band validator over the desk's real decisions (the paper ledger's theses), label \
        a sample by hand, and score catches and false alarms by symbol and by half.""",
    """\
        TradingAgents' full multi-agent pipeline was not run end to end (would require an LLM call \
        this project has no credentials for against their preferred provider) — this comparison \
        instead runs the real, unmodified structured-output type its Trader agent fills, and reads \
        every real downstream consumer of that type's output directly, which is sufficient to \
        establish the absence of a value-level check without needing the LLM call itself""",
    """\
        decision robustness, 2026-09-25 (data/perturbation_robustness.json, HELM's worst-case \
        metric; data/vocab_stress.json, PlanBench's obfuscation): MetaPM.decide kept its action on \
        all 24 meaning-preserving perturbations of six live snapshots and on all 12 renamed ones; \
        its lean moved on 2 of 24, within the 11% its own unperturbed resamples disagree. All six \
        snapshots are one moment (2026-09-25 13:56 UTC), which the groupwise audit flags as a \
        single-group result: robustness at one market state, not across states""",
]

[[proofs]]
condition = "best_implementation_studied"
how = """\
    TradingAgents' real trader.py, schemas.py, portfolio_manager.py, all three risk_mgmt/*.py \
    debators, reporting.py, and trading_graph.py read in full: trader.py's own grounding \
    instruction (line 36-39) asks the model to anchor prices in the market report, but no real \
    consumer of trader_investment_plan anywhere in the pipeline compares entry_price/stop_loss \
    against it — grepped exhaustively, zero hits"""
artefact = "src/argus/eval/baselines/tradingagents_trader.py"

[[proofs]]
condition = "best_method_studied"
how = """\
    two real methods compared: TradingAgents' prompt-only grounding instruction (no code \
    enforcement anywhere downstream) vs. ARGUS's real agents.grounding.check — deterministic \
    numeric resolution of every figure in a thesis against the facts the desk actually had, \
    already existing and already tested (test_grounding.py), reused here rather than \
    reimplemented"""
artefact = "src/argus/truth/grounding.py"

[[proofs]]
condition = "baseline_reproduced"
how = """\
    TradingAgents' real, unmodified TraderProposal.entry_price validated at 999,999.0 with no \
    relationship to any real fact — the real Pydantic validator raises nothing; its own \
    _coerce_optional_float only normalises string format (placeholder text, a trailing '%', a \
    currency symbol), never the value"""
test = "test_explainability_comparison.py::TestBaselineReproduced"

[[proofs]]
condition = "implementation_complete"
how = """\
    grounding.check/extract/GroundingReport already existed, already tested end to end \
    (test_grounding.py) before this comparison; this capability wires real live desk facts \
    through it against the real rival, not a stub"""
test = "test_grounding.py"

[[proofs]]
condition = "same_input_comparison"
how = """\
    both real systems checked on the same real, live Bitget current price (and the same \
    fabricated entry_price) for the same real symbols — TradingAgents' real validator and \
    ARGUS's real grounding.check, not a re-implementation of either"""
test = """\
    test_explainability_comparison.py::TestSameInputComparison::test_each_case_names_the_real_symbol_and_the_real_current_price"""

[[proofs]]
condition = "statistically_valid_evaluation"
how = """\
    swept across 3 real symbols and 4 fabrication magnitudes/directions (7.3x, 0.03x, -1x, \
    1000x of the real live price) — 12 cases, not one hand-picked figure; TradingAgents' real \
    validator catches 0 of 12, ARGUS catches 12 of 12"""
test = """\
    test_explainability_comparison.py::TestSameInputComparison::test_tradingagents_real_validator_never_catches_a_fabricated_price"""

[[proofs]]
condition = "costs_included"
how = "real wall-clock cost measured on both real, pure-Python checks per call"
test = "test_explainability_comparison.py::TestCosts"

[[proofs]]
condition = "out_of_sample_test"
how = """\
    run against real, freshly-fetched live Bitget ticker data across 3 real symbols never used \
    to design the mechanism, plus a positive control confirming the real current price \
    resolves cleanly on the same live data — not a blanket flag"""
test = "test_explainability_comparison.py::TestPositiveControl"

[[proofs]]
condition = "ablation"
how = """\
    isolates the exact mechanism: a figure just inside grounding.py's own TOLERANCE constant \
    resolves, the identical figure moved just past it on the same real fact does not — the \
    tolerance boundary is the load-bearing mechanism, verified directly rather than assumed"""
test = "test_explainability_comparison.py::TestAblation"

[[proofs]]
condition = "adversarial_test"
how = """\
    the real rival's edge-case behaviour tested directly: a negative price (-50.0) is accepted \
    with no error, exercising the one boundary _coerce_optional_float does not even attempt to \
    check"""
test = """\
    test_explainability_comparison.py::TestFailureCases::test_a_negative_price_is_accepted_without_error"""

[[proofs]]
condition = "failure_cases_documented"
how = """\
    three real, measured behaviours of the real validator found by running it: a negative \
    price is accepted unchecked, a percent-distance string is dropped to None rather than \
    converted, and a placeholder string is dropped to None"""
test = "test_explainability_comparison.py::TestFailureCases"

[[proofs]]
condition = "reproducibility_proven"
how = "the same real thesis and real facts checked twice return the same result"
test = "test_explainability_comparison.py::TestReproducibility"

[[proofs]]
condition = "no_specialist_capability_superior"
how = """\
    scoped explicitly — SCOPE_STATEMENT in eval/explainability_comparison.py. Claimed: on the \
    one checkable property (is a stated number traceable to a real fact), ARGUS's \
    grounding.check enforces it in code and TradingAgents' real schema does not. NOT claimed \
    TradingAgents' full pipeline never catches bad output by any other means — only that the \
    one real, checkable code path performs no value-level check. NOT claimed about \
    TraderProposal.reasoning (free text), only its two numeric fields. NOT claimed ARGUS's \
    mechanism proves a figure is correct, only that it is traceable"""
test = "test_explainability_comparison.py::TestMain"
