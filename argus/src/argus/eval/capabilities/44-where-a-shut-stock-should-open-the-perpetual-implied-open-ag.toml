name = """\
    Where a shut stock should open: the perpetual-implied open, against gloaming and nocturne"""
subtheme = "t3-execassist"
# Both harnesses call `lui/research/quote.py::_implied_open_line` through
# `overnight_comparison.console_feed` since 2026-09-26 (984 overnight nights and 61 void
# rows answered; within 0.25bps and 0.49bps of the old in-module formula).
modules = [
    "argus/lui/research/quote.py",
    "argus/eval/overnight_comparison.py",
    "argus/eval/void_comparison.py",
]
state = "implemented"
baseline = """\
    angelraph/gloaming (Season 2, MIT): overnight fair value from index futures, BTC/ETH and \
    the dollar, its own model functions run from its clone; egbujor-emmanuel/nocturne (Season \
    2, MIT): the weekend reference price, its own observations and walk-forward run from its \
    clone"""
blockers = [
    """\
        IMPLEMENTED, not OWNED. The verdicts are the harnesses' own comparison reports, shown \
        under measured and read from data/overnight_comparison.json and data/void_comparison.json \
        rather than restated here. What the reports do not carry: the perpetual's move was scored \
        over 113 nights and 8 stocks (15 April to 24 September 2026), its direction right 93% of \
        the time; gloaming's shipped inputs missed by 135bps; the lead holds on weekends (31bps \
        against 78bps, recomputed from the harness's rows)""",
    """\
        corrected 2026-09-25: this row said the two were level on QQQ. The artefact never did - \
        ARGUS is ahead on all eight stocks, narrowest on QQQ, where gloaming's Nasdaq futures are \
        nearly the same instrument: 12.50 against 14.34bps, 1.84bps ahead, 95% interval -3.59 to \
        -0.29 (per_stock.QQQ, and the comparison report's groups)""",
    """\
        groupwise (data/groupwise_audit.json): the overnight lead is carried by no stock and no \
        night and holds in both chronological halves; on nocturne's own rows ARGUS's small lead \
        over the Sunday price is carried by one name (RTSLA) and one weekend (2026-08-07), and \
        nocturne's full fade leads in the first half of the weekends and trails in the second, so \
        neither verdict on that frame is stable""",
    """\
        the estimate scored is the harnesses' own: overnight_comparison.predict's argus_perp and \
        void_comparison's ARGUS column. The console states the same quantity through \
        lui/research/quote.py::_implied_open_line, which neither harness executes; it is covered \
        by its unit test, and the credit stays on the harnesses, where the scored code lives, \
        until they call the console's function""",
    """\
        nocturne's reversal is a property of the rToken, not of the stock: on the real Monday \
        open, read at nocturne's own Sunday-evening moment, the perpetual's weekend move carried \
        through (slope +0.83 on 160 stock-weekends) and beat the last regular close its claim \
        names (70bps against 86bps, 95% interval excluding zero)""",
    """\
        no costs condition: this is a price estimate, not a trade, so there is no fee to net; \
        adversarial and reproducibility runs not yet recorded""",
]

[[proofs]]
condition = "best_implementation_studied"
how = """\
    the two S2 desks built for this question read in full: gloaming's engine/fairvalue and \
    agent_loop (its futures input is a five-day change), nocturne's core.observations, \
    study_v2 and fairvalue_v2"""
artefact = "data/overnight_comparison.json"

[[proofs]]
condition = "baseline_reproduced"
how = """\
    nocturne's published walk-forward reproduced exactly from its clone (large caps: current \
    price 2.117%, full fade 1.922%)"""
artefact = "data/void_comparison.json"

[[proofs]]
condition = "same_input_comparison"
how = """\
    every candidate read at 09:00 New York from the same saved hourly bars and scored on the \
    same Yahoo opens; nocturne's own rows with an ARGUS column"""
artefact = "data/overnight_comparison.json"

[[proofs]]
condition = "statistically_valid_evaluation"
how = "paired error differences bootstrapped over nights, the shared unit"
artefact = "data/overnight_comparison.json"

[[proofs]]
condition = "out_of_sample_test"
how = """\
    gloaming's OLS and ARGUS's fitted slope refit before each night on earlier nights only; \
    rows before a stock's 11th night excluded for every candidate"""
artefact = "data/overnight_comparison.json"

[[proofs]]
condition = "ablation"
how = """\
    the perpetual alone, against the close (basis left in), with a fitted slope; perpetual \
    plus gloaming's futures was no better (31.0 vs 30.4bps, not separable) and is not shipped"""
artefact = "data/overnight_comparison.json"

[[proofs]]
condition = "failure_cases_documented"
how = """\
    QQQ the narrowest lead (1.84bps, where gloaming's Nasdaq futures are nearly the same \
    instrument); nocturne's own frame not separable; early closes read as 16:00"""
artefact = "data/overnight_comparison.json"

[[proofs]]
condition = "implementation_complete"
how = "the console line, its record per stock, and the Yahoo close fallback"
test = "test_overnight_comparison.py::test_the_console_states_the_implied_open_with_its_record"
