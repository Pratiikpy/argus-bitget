# capability's own claimed population (coordinated bursts) does not clear the plan's own
# pre-registered bar: the temporal holdout (the ledger's last real day) is an exact tie, not a
# win, so "excludes zero in both halves" fails on the half that matters most. See blockers below.
state = "tied"
baseline = "ProsusAI/finBERT for classification; BloombergGPT and FinMA for the published bar"
blockers = [
    """\
