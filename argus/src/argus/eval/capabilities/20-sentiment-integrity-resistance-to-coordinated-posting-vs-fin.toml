artefact = "data/sentiment_comparison.json"

[[proofs]]
condition = "out_of_sample_test"
how = """\
    the reproducibility check re-runs the identical real scenario on a fresh Qwen call rather \
    than replaying a cached response, confirming the signal is stable under genuine \
    re-sampling, not just self-consistent within one call — a real, live CLI run, not a unit \
    test (real LLM cost)"""
artefact = "data/sentiment_comparison.json"

[[proofs]]
condition = "ablation"
how = """\
    two real ablations, not one, because the first was genuinely informative against the \
    module's own starting hypothesis: removing only the single named 'five accounts' sentence \
    changed NOTHING (the model's broader source-awareness reasoning already reached the same \
    conclusion unprompted) — a real negative result, reported as found, not discarded; a \
    second, coarser ablation stripping the ENTIRE source-independence framing DID show the \
    real defense degrade (directional confidence measurably rose under coordinated \
    repetition), confirming the defense is a property of the prompt's whole framing, not any \
    one sentence"""
test = "test_sentiment_comparison.py::TestNarrativeResultLogic"

[[proofs]]
condition = "adversarial_test"
how = """\
    the coordinated-posting manipulation scenario itself IS the adversarial test — N \
    near-identical unsourced posts, symbol-matched, run against both real systems; finBERT's \
    naive aggregate scales with repetition on every narrative, ARGUS's real categorical \
    judgment never flips to actionable on repetition alone on any narrative tested. Precise, \
    not overclaimed, after an independent adversarial re-check (2026-09-23): CONFIDENCE is not \
    immune — it moved from 0.05 to 0.85 on the tested narrative, a real, large move the second \
    ablation below already disclosed — only the categorical signal held. The tested attack is \
    also the easier case: N near-identical template mutations of one sentence, no \
    source/account field to dedup against, checked on 2 narratives. A harder attack — \
    textually diverse paraphrases from distinct personas, the way a real coordinated campaign \
    would actually read — was not tested and is named here as the honest limit of this \
    condition, not quietly left for a reader to assume was covered"""
artefact = "data/sentiment_comparison.json"

