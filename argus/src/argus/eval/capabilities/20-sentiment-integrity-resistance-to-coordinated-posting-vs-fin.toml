test = "test_sentiment_comparison.py::TestNarrativeResultLogic"

[[proofs]]
condition = "statistically_valid_evaluation"
how = """\
    every narrative tested shows the same pattern on real finBERT output (matching_count \
    scales with repetition every time) and the real ARGUS analyst never once lets repetition \
    alone flip a non-actionable read to actionable, across every narrative run — not a single \
    convenient case"""
artefact = "data/sentiment_comparison.json"

[[proofs]]
condition = "costs_included"
how = """\
    finBERT's real local CPU latency measured directly (~30ms/post); ARGUS's real Qwen call \
    count and wall-clock measured directly — the genuine cost asymmetry (free vs. real \
