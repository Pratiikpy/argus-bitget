    inference model, used exactly as its own README documents, nothing redistributed)"""
artefact = "src/argus/eval/baselines/finbert_loader.py"

[[proofs]]
condition = "implementation_complete"
how = """\
    SentimentAnalyst's real role prompt exercised end to end via a real Qwen call, not \
    paraphrased or mocked"""
artefact = "data/sentiment_comparison.json"

[[proofs]]
condition = "same_input_comparison"
how = """\
    both real systems run on identical symbol-matched coordinated-posting scenarios (N \
    near-identical rephrasings of one unsourced claim) built from the same underlying \
