# RE-GRADED 2026-09-29 from IMPLEMENTED to TIED: the real-cluster measurement the previous note
# asked for was run (eval/sentiment_integrity_real.py, data/sentiment_integrity_real.json, 139
# real Qwen calls, 232,721 tokens total per the cost ledger across both attempts (a first run
