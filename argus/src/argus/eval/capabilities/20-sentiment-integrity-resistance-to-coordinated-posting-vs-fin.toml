how = """\
    SentimentAnalyst's own docstring names the real axis: not classification accuracy \
    (explicitly disclaimed — 'FinBERT is the baseline and beating it on classification is not \
    where the edge is'), but the source-independence integrity layer finBERT's architecture \
    has no equivalent of at all — a classifier with zero source-identity concept cannot \
    discount coordinated repetition, by construction, not by omission"""
artefact = "src/argus/eval/sentiment_comparison.py"

[[proofs]]
condition = "baseline_reproduced"
how = """\
    the REAL, published ProsusAI/finbert model loaded via the standard transformers.pipeline() \
