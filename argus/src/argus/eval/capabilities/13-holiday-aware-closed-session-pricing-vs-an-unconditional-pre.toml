    directly (long when flat plus a holiday is present, hold when already long and holidays \
    are still near, liquidate when already long and holidays clear, stay flat when neither)"""
test = """\
    test_baselines.py::TestVendoredFilesHaveNotDrifted::test_quantconnect_preholiday_decision_body_matches_the_pinned_hash"""

[[proofs]]
condition = "implementation_complete"
how = """\
    research.gap_study.study()/raw_sessions() given a real, optional holidays parameter \
    (backward-compatible — omitting it keeps every prior caller's exact behaviour), wired end \
    to end to a real US equity holiday calendar (Lean's own real market-hours database, 293 \
    real dates, 1998-2028)"""
test = "test_gap_study.py::TestRealHolidayCalendarThreading"

[[proofs]]
condition = "same_input_comparison"
how = """\
    the SAME real basis-point series for every rToken, fetched once, classified twice — once \
