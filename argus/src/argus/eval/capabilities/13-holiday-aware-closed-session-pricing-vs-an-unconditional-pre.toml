test = """\
    test_afterhours_comparison.py::TestBaseCase::test_the_real_calendar_unlocks_real_holiday_sessions"""

[[proofs]]
condition = "costs_included"
how = """\
    real wall-clock cost measured on both real sides — QuantConnect's real vendored decision \
