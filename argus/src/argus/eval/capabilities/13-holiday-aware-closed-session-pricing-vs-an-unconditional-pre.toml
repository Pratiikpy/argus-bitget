# proof now needs a groupwise check on the capability's own artefact, and this
# row's does not pass it. The reason and the route back are its first blocker.
state = "implemented"
baseline = """\
    QuantConnect/Tutorials real Pre-Holiday Effect (unconditional long-before-holiday decision \
    logic)"""
blockers = [
    """\
        RE-GRADED 2026-09-25 from OWNED to IMPLEMENTED by the groupwise gate \
        (data/groupwise_audit.json): the only per-session rows in data/afterhours_comparison.json \
        are the rival's: an unconditional long through each of 24 holiday closures, audited as \
        context. They flip between halves - the first twelve sessions averaged +86.0bps net, the \
        last twelve -10.2bps - so the rival's 54.2% win rate is not a stable effect; but ARGUS's \
        side, the holiday phase existing, has no per-session measurement to break down. Route \
        back: record ARGUS's per-session decision and its realised outcome beside the rival's.""",
    """\
        The real calendar LOOKUP (self.TradingCalendar.GetDaysByType) needs a full Lean engine and \
        was not run — the real, same-source calendar DATA was substituted for it, a data-source \
        substitution from the real decision LOGIC, which runs unmodified. The measured win rate is \
        close to, not decisively above, the 50% coin flip, and moved from a prior 50.0% observed \
        earlier the same session on a different live fetch to 54.2% on this run — this comparison \
        reports whichever real number is live the day it runs, not a fixed historical verdict""",
]

[[proofs]]
condition = "best_implementation_studied"
how = """\
    QuantConnect/Tutorials' real '83 Pre-Holiday Effect' tutorial page read in full — its own \
    real, published two-block structure: a first block computing `public_holidays = \
    list(set(holidays) - set(weekends))` specifically to exclude ordinary weekend closures, \
    and a second, real decision block that never uses that filtered variable, checking the \
    un-subtracted `holidays` count instead — a genuine inconsistency between the tutorial's \
    own two published fragments, found by reading them together rather than either alone. \
    ARGUS's own gap_study.py re-read too, confirming a real, previously-dead branch: study() \
    always constructed DualClock() with no holidays argument, so the SessionPhase.HOLIDAY \
    branch _closed_sessions() already classifies for had never once fired in a real run"""
artefact = "src/argus/eval/baselines/quantconnect_preholiday_decision.py"

[[proofs]]
condition = "best_method_studied"
how = """\
    two real methods compared: QuantConnect's real, unconditional 'go long whenever any \
    holiday count is nonzero, exit when it hits zero' decision logic vs. ARGUS's real \
    gap_study, which conditions on the deepest real closure type reached and reports \
    continuation-vs-reversal and net-of-fee clearance rather than assuming a directional bias \
    upfront"""
artefact = "src/argus/research/gap_study.py"

[[proofs]]
condition = "baseline_reproduced"
how = """\
    QuantConnect's real, unmodified 4-line decision snippet run unmodified via exec() with \
    self/holidays injected into the namespace, byte-hash-pinned against the vendored source \
