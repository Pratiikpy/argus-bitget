test = """\
    test_gap_study.py::TestRealHolidayCalendarThreading::test_study_with_no_holidays_keeps_its_old_behaviour"""

[[proofs]]
condition = "adversarial_test"
how = """\
    the real reference's own boundary tested directly rather than assumed: it holds (does \
