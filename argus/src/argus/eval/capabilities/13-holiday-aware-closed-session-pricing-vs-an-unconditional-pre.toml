test = """\
    test_afterhours_comparison.py::TestBaseCase::test_the_real_win_rate_is_reported_not_assumed"""

[[proofs]]
condition = "ablation"
how = """\
    the calendar itself is the ablation: the identical real fetched data classified with the \
