name = "Research workbench data breadth vs. OpenBB's keyless providers"
subtheme = "t3-datasources"
modules = [
    "argus/eval/perception_breadth.py",
    "argus/lui/research/positioning.py",
    "argus/lui/research/fundamentals.py",
    "argus/lui/research/sentiment.py",
    "argus/market/options.py",
    "argus/market/darkpool.py",
    "argus/market/bitget_mcp.py",
    "argus/market/bitget_positioning.py",
    "argus/market/evidence.py",
]
# Split from 19 (the desk's perception) on 2026-09-29. Track 3's datasource line is about the
# research workbench a person asks questions of; 19 measures what the trading desk's model reads
# each cycle. The desk's loss to OpenBB stays on 19 as measured; this row is the workbench, on the
# same inputs, the same day, the same category mapping.
state = "owned"
baseline = """\
    OpenBB-finance/OpenBB (commit 3e071fcc) with every keyless provider installed (cboe, finra, \
    finviz, sec, tmx, yfinance, stockgrid, seeking_alpha, wsj), called through OpenBB's own obb \
    interface by scripts/pit_runners/openbb_breadth_runner.py"""
blockers = [
    """\
        GRADED OWNED 2026-09-29 on the claim as scoped: per-symbol breadth of data categories \
        answered, against every keyless OpenBB provider. Design day (OpenBB read 2026-09-28 \
        22:20 UTC): the workbench's six per-stock research answers cited 16.0 categories per \
        stock against OpenBB's 12.4 on the ten rToken underlyings, +3.6 [2.7, 4.3]. Held-out \
        day (2026-09-29 02:46-03:02 UTC, twelve underlyings, category map and scoring \
        unchanged): 15.3 against 11.7, +3.7, ahead on all twelve; pooled over both days +3.6 \
        [3.1, 4.1], the same on each day, 9 of 10 per-symbol signs repeated. Adversarial \
        reading, scoring only the categories OpenBB's keyless catalogue has an endpoint for (so \
        social text, the venue's own perpetuals and prediction markets are dropped): +1.0 and \
        +1.2, pooled [0.7, 1.5], ahead on 11 of 12 the second day. Ablation: removing Bitget's \
        data service costs 4.7 categories and turns the lead to -1.1; FINRA carries 2.0 and \
        Yahoo 1.9, every other source one or less. One product change fell between the days and is not hidden: the \
        workbench began reading fund filings (NPORT-P, N-CSR) for QQQ, TQQQ and SQQQ, found \
        missing on the design day. Stated reasons a specialist is still wider: OpenBB with paid \
        keys (twelve providers named in the artefact, fmp, intrinio, polygon, benzinga, tiingo \
        among them) is outside the keyless scope; OpenBB alone answers QQQ's analyst consensus \
        (TMX, one row) and SQQQ's ETF composition. Effectiveness, whether a category improves \
        an answer, is not measured by this row.""",
    """\
        A defect found by the same work and fixed at the source: Bitget's data service returns \
        its earnings-calendar and dividend dates one day early (Apple's ex-dates on Sundays, \
        NVIDIA's report dated the day before its 10-Q), so every earnings countdown and \
        ex-dividend date the console showed was a day off. market/bitget_mcp.correct_dates moves \
        the verified fields; insider dates, 13F periods and split record dates were checked and \
        are not shifted.""",
]

[[proofs]]
condition = "best_implementation_studied"
how = """\
    OpenBB's provider packages read for their credential requirements and per-symbol endpoints, \
    and every keyless one installed from the clone and run through its own interface"""
artefact = "data/openbb_breadth_raw.json"

[[proofs]]
condition = "best_method_studied"
how = """\
    breadth counted as categories answered with data per symbol, one taxonomy applied to both \
    sides with every mapping in the artefact; a count of endpoints or calls was rejected because \
    it rewards redundant endpoints (OpenBB serves price history from four), and a count of \
    categories attempted because it credits calls that returned nothing"""
artefact = "data/perception_breadth.json"

[[proofs]]
condition = "baseline_reproduced"
how = """\
    OpenBB's keyless providers run live on the same twelve tickers on two days, each call with \
    its row count, latency and error; the providers that answered and those that stayed silent \
    are summarised in the comparison's baseline block"""
artefact = "data/perception_breadth.json"

[[proofs]]
condition = "implementation_complete"
how = """\
    every category the workbench is credited with is read live by a research answer a person \
    can ask in the console: options, dark pools and short volume (positioning.py), holders, \
    profile, dividends, fund holdings and filings (fundamentals.py), crowd posts, the venue's \
    perpetuals and prediction markets"""
test = "test_perception_feeds.py"

[[proofs]]
condition = "same_input_comparison"
how = """\
    the same underlyings, the same day, the same category mapping, for OpenBB, the desk and the \
    workbench, on both days"""
test = "test_perception_breadth.py::test_the_published_artefact_matches_a_rerun"
artefact = "data/perception_breadth.json"

[[proofs]]
condition = "statistically_valid_evaluation"
how = """\
    bootstrap intervals over the per-symbol differences, pooled over both days and broken down \
    by symbol and day by the groupwise audit: every category +3.6 [3.1, 4.1], rival-reachable \
    categories only [0.7, 1.5], neither flipping between the days"""
artefact = "data/perception_breadth.json"

[[proofs]]
condition = "costs_included"
how = """\
    both sides keyless, no model called by either; wall-clock seconds per symbol as each side's \
    runner timed them: OpenBB 116 and 128 summed over its calls, the workbench 13 and 13 over \
    its six answers"""
artefact = "data/perception_breadth.json"

[[proofs]]
condition = "out_of_sample_test"
how = """\
    a second day read after the comparison was built, twelve underlyings, nothing refitted: \
    +3.7 on every category and +1.2 on rival-reachable ones (held_out)"""
artefact = "data/perception_breadth.json"

[[proofs]]
condition = "ablation"
how = """\
    the lead recomputed without each workbench source in turn (ablation.without): Bitget's data \
    service carries 4.7 categories, FINRA 2.0 and Yahoo 1.9, no other source more than one"""
artefact = "data/perception_breadth.json"

[[proofs]]
condition = "adversarial_test"
how = """\
    the comparison rescored with every category OpenBB has no keyless endpoint for removed, so \
    the lead cannot rest on what the rival never attempts (adversarial)"""
artefact = "data/perception_breadth.json"

[[proofs]]
condition = "failure_cases_documented"
how = """\
    the categories OpenBB answers and the workbench does not are listed per symbol \
    (only_openbb_vs_workbench, only_openbb), and the keyed providers excluded from the baseline \
    are named"""
artefact = "data/perception_breadth.json"

[[proofs]]
condition = "reproducibility_proven"
how = """\
    the report is recomputed from the saved raw runs of both days and must equal the published \
    one"""
test = "test_perception_breadth.py::test_the_published_artefact_matches_a_rerun"

[[proofs]]
condition = "no_specialist_capability_superior"
how = """\
    scoped to keyless providers; OpenBB with paid keys is wider and its twelve keyed providers \
    are named; the two categories OpenBB alone answered on the held-out day (QQQ's consensus \
    from TMX, SQQQ's ETF composition) are listed as failure cases"""
artefact = "data/perception_breadth.json"
