name = "Self-evolving review rules"
subtheme = "t3-review"
modules = [
    "argus/desk/review.py",
    "argus/eval/review_comparison.py",
    "argus/eval/baselines/tradingagents_loader.py",
    "argus/eval/baselines/tradingagents_memory.py",
    "argus/eval/baselines/tradingagents_rating.py",
    "argus/desk/rule_lifecycle.py",
    "argus/eval/review_rivals.py",
]
# Demoted from OWNED on 2026-09-20, when `verify()` began opening the artefacts instead
# of checking that files existed: failure_cases_documented and out_of_sample_test were
# both claimed and the artefacts recorded nothing about either. out_of_sample_test was
# fixed by adding `data/review_oos.json` (216/217 held-out split). failure_cases_documented
# is fixed 2026-09-22 by adding `ReviewReport.failure_cases` — a real, structured summary
# of every rejected rule's own measured failure mode (status, precision, why), not a
# rename of the existing `rejected` field — to `desk/review.py::as_dict()`. All thirteen
# conditions now VERIFIED or ATTESTED; restored to OWNED.
state = "tied"
baseline = "TauricResearch/TradingAgents reflection memory"
blockers = [
    """\
        RE-GRADED 2026-09-28 from IMPLEMENTED to TIED (Activity/27_CAPABILITY_CLOSE_PLAN.md §5). \
        eval/review_rivals.py now records every real decision with each gate's flag, and the \
        excess-catch lead over QuantDinger's low-win-rate diagnostic has a day-block interval: \
        overall [+0.0004, +0.0154] per decision, above zero, but carried by one defect kind — \
        conflict [+0.020, +0.057]; grounding [-0.013, +0.009] and lean [-0.024, +0.007] favour \
        QuantDinger slightly and not significantly. The retention loss through a falling base \
        rate (S3: 32% of real rules kept) was attacked with a pre-registered fix — retire on \
        lift against a local rolling base rate — which kept 33.75% at 40 seeds, short of its \
        pre-registered bar (double), so it was reverted and kept as a tested negative result in \
        desk/rule_lifecycle.py. Winning needs the lead outside one kind and S3 fixed.""",
    """\
        RE-GRADED 2026-09-24 from OWNED to IMPLEMENTED: TradingAgents' reflection memory is not \
        the specialist for Review & Self-Evolution; mnemox-ai/tradememory-protocol, \
        cholhwanjung/trading-agent (a statistical rule lifecycle), OpenByteInc/QuantDinger and the \
        S2 entry Azedfx/TradePilot-AI have not been run on the same input (rival review of \
        2026-09-24). OWNED returns only when they are. The same review's base-rate defect - a \
        coin-flip rule graded ACTIVE - is fixed in desk/review.py: regenerated 2026-09-25 over 622 \
        decisions, narrow-evidence-base is graded NO_DISCRIMINATION at lift 0.9x against its 41% \
        base rate (p = 0.21), not ACTIVE""",
    """\
        The checklist is honest and currently empty: no rule has earned promotion, so this is a \
        mechanism for learning rules rather than a set of learned rules, and it is described that \
        way everywhere it appears.""",
    """\
        sequential-agreement fixed 2026-09-25: it read 'contagion' anywhere in the panel note, and \
        the concurrent panel's own note says 'consensus rather than contagion', so it fired on 299 \
        of 311 in-sample and 311 of 311 held-out decisions; it now fires on the sequential wording \
        only (30 and 0). Its verdict is unchanged - PROPOSED, since no OUTCOME defect exists yet \
        to grade it against - and so is every other rule's on the regenerated data/review_oos.json \
        (3 of 3 gradeable rules keep their verdict on the held-out half)""",
    """\
        rules written by machine, 2026-09-25 (data/rule_proposals.json, fit on the earlier half, \
        graded on the later): induction beats the hand-written rules on conflict defects held out \
        (precision 90%, 56 of 62 firings, against a 61% base rate; the hand-written rules' 3%), \
        and no proposer beats the base rate on grounding (the best induced rules 38% against 39%) \
        or lean (induced rules over every pair 48% on 23 firings against 50%; no other proposer's \
        lean rule fired). The Qwen proposer (29 paid calls) had no rule admitted; the model-free \
        contrast proposer had none on the same 29 pairs and 2 on every pair, induction 1 and 17 - \
        the model beat neither. Groupwise: the induced rules' held-out lift is carried by the \
        conflict kind alone (data/groupwise_audit.json)""",
    """\
        The four named specialists were run on 2026-09-26 (eval/review_rivals.py, \
        data/review_rivals.json, 40 seeds a cell, no model call), each from its own source at a \
        recorded commit: tradememory-protocol, cholhwanjung/trading-agent, QuantDinger and \
        TradePilot-AI (its TypeScript run unmodified), with TradingAgents' unconditional memory \
        beside them. On the held-out half of the real record ARGUS's rules catch the most defects \
        beyond chance: +30.0 excess for the lifecycle on active rules (4,212 warnings), against \
        +14.5 for QuantDinger's low-win-rate diagnostic, the best rival (9,803), and +5.9 for \
        cholhwanjung (6,101). With planted rules at 5% and 25% base rates ARGUS admits almost no \
        null rule (false admission 0.2-2%) where TradePilot admits 70% and tradememory 100%. It \
        LOSES where the defect is common or falling: at 60% and 75% base rates it warns with no \
        real rule (power 0.3%, where the rivals warn with every rule, real or null), and when the \
        base rate falls from 50% to 20% while every rule keeps its lift, its lifecycle retires 68% \
        of the real rules as decayed; the rivals, which never retire anything, keep them all, and \
        keep 100% of the dead rules warning too (ARGUS 2%). OWNED needs a lifecycle that holds a \
        real rule through a falling base rate.""",
]

[[proofs]]
condition = "implementation_complete"
how = "rules are replayed over real decisions and must earn a place by performance"
artefact = "data/review_report.json"

[[proofs]]
condition = "failure_cases_documented"
how = "replayed over 40 real decisions, none of the five standing rules earned one"
artefact = "data/review_report.json"

[[proofs]]
condition = "statistically_valid_evaluation"
how = "a rule is promoted on measured precision, never on having been written down"
test = "test_review.py"

[[proofs]]
condition = "best_implementation_studied"
how = """\
    the four systems already read for the sibling episodic-memory audit (TradingAgents, \
    RD-Agent, FinMem, LangGraph) checked specifically for a process-rule/checklist-learning \
    mechanism, not just symbol memory - grepped directly for \
    checklist/process_rule/precision/earned concepts in RD-Agent and FinMem's own source: no \
    match in either. Only TradingAgents has any lessons-reuse mechanism at all (the reflection \
    log), and it has no precision-gated promotion of any kind - confirmed by reading it in \
    full for the sibling capability, not re-guessed here"""
artefact = "../research/architecture/agent-architecture-audit.md"

[[proofs]]
condition = "best_method_studied"
how = """\
    TradingAgents' real memory/reflection code read in full (same read as the sibling Episodic \
    memory capability): graph/reflection.py and agents/utils/memory.py's TradingMemoryLog - \
    store, update, and unconditional read-back, with no precision, fire-rate, or track-record \
    concept anywhere"""
artefact = "src/argus/eval/baselines/tradingagents_memory.py"
test = "test_review_comparison.py"

[[proofs]]
condition = "baseline_reproduced"
how = """\
    the same vendored, byte-verified TradingMemoryLog already run for Episodic memory (commit \
    be952b8eccb49720509af544c6675233bc1f10d0) - no new vendoring needed, reused directly: real \
    writes, real outcome updates, real unconditional reads"""
artefact = "src/argus/eval/baselines/tradingagents_memory.py"
test = "test_baselines.py::TestTradingAgentsLoaderMakesTheRealCodeRunnable"

[[proofs]]
condition = "same_input_comparison"
how = """\
    a decision with a demonstrably WRONG outcome (a real -15% realised return) stored via the \
    real vendored TradingMemoryLog and read back later: the reflection describing the wrong \
    call is re-injected identically to one about a right call, confirmed by running the real \
    code twice, once each way"""
test = "test_review_comparison.py::TestUnconditionalReuse"

[[proofs]]
condition = "ablation"
how = """\
    all four of ARGUS's lifecycle thresholds (MIN_PRECISION, ALWAYS_FIRES, NEVER_FIRES, \
    MIN_FIRINGS) shown independently load-bearing by patching each to a value that flips an \
    otherwise-identical fixture's verdict (ACTIVE->MISLEADING, ACTIVE->NO_DISCRIMINATION, \
    ACTIVE->DEAD_WEIGHT, ACTIVE->EARNING), verified programmatically, not derived — the last \
    two were added 2026-09-21; this line correctly said two before that, and is updated now \
    that the code genuinely tests all four"""
test = "test_review_comparison.py::TestThresholdAblations"

[[proofs]]
condition = "adversarial_test"
how = """\
    six designed fixtures, each targeting exactly one of the seven named lifecycle states \
    (PROPOSED, DEAD_WEIGHT, NO_DISCRIMINATION, MISLEADING, EARNING, ACTIVE), run through the \
    real evaluate() and confirmed to land on the intended status every time - including \
    EARNING, which this module's own docstring records as a real self-found bug (unreachable \
    until a specific fix), re-verified reachable here on fresh fixtures rather than assumed \
    fixed"""
test = "test_review_comparison.py::TestLifecycleCases"

[[proofs]]
condition = "costs_included"
how = """\
    TradingAgents' real write path costs one LLM call per graded episode \
    (Reflector.reflect_on_final_decision) to produce the prose it stores unconditionally; \
    ARGUS's evaluate() is pure arithmetic over independently observed defects - zero tokens, \
    zero model calls, every single replay"""
artefact = "src/argus/eval/review_comparison.py"
test = "test_review_comparison.py"

[[proofs]]
condition = "out_of_sample_test"
# The previous version of this proof argued that the in-sample run was ALSO the
# out-of-sample one because the same unmodified function produced it. That is an
# argument about code paths, not about held-out data, and `verify()` was right to
# reject it: a rule graded on the decisions it was written against describes the
# past. `eval/reviewoos.py` now runs the real thing — 433 decisions split
# chronologically (never randomly, which would grade a rule on a decision that
# preceded the ones it was fitted on), each half scored only against the defects
# observed within it.
how = """\
    433 real decisions split 216/217 by ledger sequence; every standing rule graded on both \
    halves at the production MIN_DECISIONS. 3 of 5 are gradeable on the held-out half and all \
    3 keep the same verdict; the other 2 fire too rarely to judge and are counted as \
    not-gradeable rather than as failures, because the absence of a test is not a bad result"""
artefact = "data/review_oos.json"

[[proofs]]
condition = "reproducibility_proven"
how = """\
    evaluate() is a pure function of its inputs - no model, no seed, no simulation. Every \
    fixture in this comparison is hand-constructed and fixed"""
test = "test_review_comparison.py"

[[proofs]]
condition = "no_specialist_capability_superior"
how = """\
    scoped explicitly - SCOPE_STATEMENT in eval/review_comparison.py. Claimed: the MACHINERY \
    that refuses a bad rule by name (DEAD_WEIGHT, NO_DISCRIMINATION, MISLEADING) exists, runs \
    correctly across six real lifecycle transitions, and has no equivalent anywhere in \
    TradingAgents' real code (grepped directly, zero matches). NOT claimed: that \
    TradingAgents' unconditional reuse is a design mistake on its own premise (a model \
    re-reads the prose and can itself discount it, unlike ARGUS's constitution-gated loop \
    where a model's live judgment is deliberately not the backstop). Also NOT claimed: that \
    ARGUS's checklist currently contains any earned rules - it does not, disclosed as a \
    standing blocker below, unchanged by this push"""
artefact = "src/argus/eval/review_comparison.py"
test = "test_review_comparison.py::TestScopeStatement"
